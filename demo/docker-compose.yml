services:
  jaeger:
    # Pinned like OBI below, so the walkthrough still reproduces months from now
    # (Jaeger 2.x all-in-one changed the query API the analysis scripts use).
    image: jaegertracing/all-in-one:1.76.0
    # Every published port binds to 127.0.0.1 only: this is an unauthenticated demo, and a
    # port published on all interfaces is reachable from outside the host (scanners found
    # 8080 within minutes). From another machine, forward the ports over SSH instead:
    #   ssh -L 16686:localhost:16686 -L 8080:localhost:8080 <host>
    ports:
      - "127.0.0.1:16686:16686"   # UI / API
      - "127.0.0.1:4318:4318"     # OTLP HTTP (OBI reaches it from the host network)
    networks: [expnet]

  backend:
    # JRE_IMAGE switches the JVM the three services run on, e.g. JRE_IMAGE=eclipse-temurin:25-jre.
    image: "${JRE_IMAGE:-eclipse-temurin:21-jre}"
    environment:
      # BACKEND_ENGINE=cio switches the backend server engine from Netty to CIO.
      BACKEND_ENGINE: "${BACKEND_ENGINE:-}"
      # BACKEND_TLS=1 adds HTTPS on 8443 (self-signed); point the frontend at it with
      # BACKEND_URL=https://backend:8443 and CLIENT_ENGINE=okhttp.
      BACKEND_TLS: "${BACKEND_TLS:-}"
    volumes:
      - ./backend/build/install/backend:/app:ro
    command: ["/app/bin/backend"]
    networks: [expnet]

  frontend:
    image: "${JRE_IMAGE:-eclipse-temurin:21-jre}"
    environment:
      BACKEND_URL: "${BACKEND_URL:-http://backend:8081}"
      # Attach the coroutine agent by setting FRONTEND_JAVA_OPTS, e.g.:
      #   FRONTEND_JAVA_OPTS="-javaagent:/coroagent/coroagent.jar -Dobicoro.native=/coroagent/libcoroagent.so"
      # Leave it empty to reproduce the baseline (broken traces).
      JAVA_OPTS: "${FRONTEND_JAVA_OPTS:-}"
      OBICORO_DEBUG: "${OBICORO_DEBUG:-}"
      # KTOR_ENGINE=cio switches the frontend server engine from Netty to CIO.
      KTOR_ENGINE: "${KTOR_ENGINE:-}"
      # NETTY_TRANSPORT=epoll switches Netty from the NIO transport to native epoll.
      NETTY_TRANSPORT: "${NETTY_TRANSPORT:-}"
      # CLIENT_ENGINE=okhttp|java switches the backend client engine; CLIENT_POOL=<n> makes the
      # CIO client share at most n pipelined connections.
      CLIENT_ENGINE: "${CLIENT_ENGINE:-}"
      CLIENT_POOL: "${CLIENT_POOL:-}"
    volumes:
      - ./frontend/build/install/frontend:/app:ro
      - ../agent/dist:/coroagent:ro
    command: ["/app/bin/frontend"]
    ports:
      - "127.0.0.1:8080:8080"
    networks: [expnet]

  jfront:
    image: "${JRE_IMAGE:-eclipse-temurin:21-jre}"
    environment:
      BACKEND_URL: http://backend:8081
      # JFRONT_EXECUTOR=virtual switches to a virtual-thread-per-task executor
      JFRONT_EXECUTOR: "${JFRONT_EXECUTOR:-}"
    volumes:
      - ./jfront/build/install/jfront:/app:ro
    command: ["/app/bin/jfront"]
    ports:
      - "127.0.0.1:8082:8082"
    networks: [expnet]

  obi:
    image: otel/ebpf-instrument:v1.0.0
    privileged: true
    pid: "host"
    network_mode: "host"   # attach TC in the host netns, reach Jaeger via localhost:4318
    volumes:
      - ./obi-config.yml:/config/obi-config.yml:ro
      # OBI v1.0.0 attaches sys_enter/exit_ioctl tracepoints to compensate for a kernel FIONREAD bug
      # (commit 929e30f93125, in 6.6.128+, 6.12.75+, 6.18.14+ and 6.19+). Tracepoint ids are read
      # from tracefs, which a privileged container does not see by default; without it OBI turns
      # context propagation off on affected kernels.
      - /sys/kernel/tracing:/sys/kernel/tracing
    command: ["-config", "/config/obi-config.yml"]

networks:
  expnet: {}
